<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CN 区 HR 服务指标分析 · 工作量仪表板 v5</title>
<script src="echarts.min.js"></script>
<script src="hr_data.js"></script>
<script src="quote_data.js"></script>
<style>
  :root{
    --daily:#2f7ed8; --proj:#f59e0b;
    --bg:#f5f7fa; --panel:#ffffff; --line:#e4e8ef;
    --text:#2c3440; --muted:#8a94a6; --head:#1f2733;
    --svc-primary:#6c5ce7; --svc-accent:#fd79a8; --svc-gold:#f39c12;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:13px;}
  header{background:linear-gradient(90deg,#1f3a5f,#2f7ed8);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  header h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.5px;}
  header .right{display:flex;align-items:center;gap:14px;}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .tab{background:rgba(255,255,255,.15);color:#fff;border:none;padding:7px 14px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:500;transition:.15s;white-space:nowrap;}
  .tab:hover{background:rgba(255,255,255,.3);}
  .tab.active{background:#fff;color:var(--head);}
  #btn-info{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);padding:6px 12px;border-radius:7px;cursor:pointer;font-size:12px;}
  #btn-info:hover{background:rgba(255,255,255,.3);}
  .body{display:flex;min-height:calc(100vh - 53px);}
  aside{width:200px;background:var(--panel);border-right:1px solid var(--line);padding:12px;flex-shrink:0;overflow-y:auto;max-height:calc(100vh - 53px);transition:width .25s ease;}
  aside.collapsed{width:48px;padding:8px 4px;}
  aside.collapsed .sidebar-head span:not(.sidebar-toggle){display:none;}
  aside.collapsed .person-name{display:none;}
  aside.collapsed .sidebar-info{display:none;}
  aside.collapsed .person-row{justify-content:center;padding:6px 0;}
  .sidebar-head{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:12px;margin-bottom:8px;color:var(--head);}
  .sidebar-toggle{cursor:pointer;font-size:14px;width:22px;text-align:center;line-height:1;border-radius:4px;flex-shrink:0;}
  .sidebar-toggle:hover{background:#e3e9f2;}
  .sidebar-actions{display:flex;gap:4px;}
  .mini-btn{font-size:10px;padding:2px 6px;border:1px solid var(--line);background:#f0f3f8;border-radius:5px;cursor:pointer;color:var(--muted);}
  .mini-btn:hover{background:#e3e9f2;color:var(--text);}
  .person-row{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:6px;cursor:pointer;font-size:12px;line-height:1.4;}
  .person-row:hover{background:#f0f3f8;}
  .person-avatar-mini{font-size:15px;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;background:#f0f3f8;border-radius:7px;font-weight:600;}
  .person-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .sidebar-info{margin-top:10px;font-size:11px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;line-height:1.4;}
  main{flex:1;padding:14px 18px;overflow-x:hidden;min-width:0;}
  #filterbar{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px;}
  .filter-item{display:flex;flex-direction:column;gap:4px;}
  .filter-item label{font-size:11px;color:var(--muted);}
  .filter-select{padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:12px;background:#fff;color:var(--text);min-width:130px;}
  .btn-reset,.btn-apply{padding:7px 14px;border-radius:7px;font-size:12px;cursor:pointer;border:1px solid var(--line);}
  .btn-reset{background:#fff;color:var(--muted);}
  .btn-apply{background:var(--daily);color:#fff;border-color:var(--daily);}
  .btn-apply:hover{opacity:.9;}
  .kpi-row{display:flex;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
  .kpi-group{flex:1;min-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
  .kpi-group.daily{border-top:3px solid var(--daily);} .kpi-group.project{border-top:3px solid var(--proj);}
  .kpi-group-title{grid-column:1/-1;font-weight:600;font-size:13px;color:var(--head);margin-bottom:2px;}
  .kpi{background:#f7f9fc;border-radius:8px;padding:10px 8px;text-align:center;}
  .kpi.daily{background:#eef4fd;} .kpi.project{background:#fef6e9;}
  .kpi-label{font-size:11px;color:var(--muted);margin-bottom:4px;}
  .kpi-value{font-size:19px;font-weight:700;color:var(--head);line-height:1.1;}
  .kpi-sub{font-size:10px;color:var(--muted);margin-top:3px;}
  .note{background:#fff8e6;border:1px solid #f3e2b3;color:#8a6d1f;font-size:11px;padding:8px 12px;border-radius:8px;margin-bottom:14px;line-height:1.5;}
  .section-title{font-size:14px;font-weight:600;color:var(--head);margin:18px 0 10px;padding-left:9px;border-left:4px solid var(--daily);}
  .chart-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  .chart-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
  .chart-title{font-size:12px;font-weight:600;color:var(--head);margin-bottom:4px;}
  .chart{width:100%;height:280px;}
  .stat-row{display:flex;gap:14px;margin-top:14px;flex-wrap:wrap;}
  .stat-row .kpi{flex:1;min-width:160px;}
  .table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
  .table-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .table-search{padding:6px 10px;border:1px solid var(--line);border-radius:7px;font-size:12px;width:260px;}
  .table-count{font-size:11px;color:var(--muted);}
  table.data-table{width:100%;border-collapse:collapse;font-size:12px;}
  table.data-table th{background:#f0f3f8;text-align:left;padding:7px 8px;color:var(--head);border-bottom:2px solid var(--line);position:sticky;top:0;}
  table.data-table td{padding:6px 8px;border-bottom:1px solid #eef1f6;}
  table.data-table td.num{text-align:right;font-variant-numeric:tabular-nums;}
  table.data-table tr:hover td{background:#f7f9fc;}
  .pager{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:12px;}
  .pg-btn{padding:5px 14px;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;font-size:12px;}
  .pg-btn:disabled{opacity:.4;cursor:not-allowed;}
  .pg-info{font-size:12px;color:var(--muted);}

  /* ===== 服务展示页样式 ===== */
  .svc-hero{background:linear-gradient(135deg,#6c5ce7,#a55eea);color:#fff;border-radius:12px;padding:28px 24px;margin-bottom:16px;text-align:center;}
  .svc-hero h2{margin:0 0 8px;font-size:22px;font-weight:700;}
  .svc-hero p{margin:0;font-size:14px;opacity:.88;}

  /* ★ 多目标返回导航 */
  .back-nav{position:relative;display:inline-block;margin-bottom:14px;}
  .back-menu{display:none;position:absolute;top:100%;left:0;z-index:100;min-width:140px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.12);padding:4px 0;margin-top:4px;}
  .back-menu.open{display:block;}
  .back-menu-item{padding:8px 16px;font-size:13px;color:var(--text);cursor:pointer;transition:.1s;}
  .back-menu-item:hover{background:#f0eefc;color:var(--svc-primary);}
  .back-menu-item:first-child{font-weight:600;color:var(--svc-primary);border-bottom:1px solid var(--line);}
  .back-btn{display:inline-flex;align-items:center;gap:4px;padding:7px 18px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s;}
  .back-btn:hover{transform:translateX(-3px);box-shadow:0 4px 14px rgba(102,126,234,.35);}

  .svc-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;background:var(--panel);padding:10px 14px;border:1px solid var(--line);border-radius:9px;flex-wrap:wrap;}
  .svc-toolbar label{font-size:12px;color:var(--muted);white-space:nowrap;}
  .svc-toolbar-reset{margin-left:auto;font-size:11px;padding:4px 12px;border-radius:6px;background:#fef2f2;color:#dc2626;border-color:#fecaca;}
  .svc-toolbar-reset:hover{background:#fee2e2;color:#b91c1c;}
  .svc-section{margin-bottom:18px;}
  .svc-mod-header{font-size:15px;font-weight:700;color:var(--head);margin-bottom:10px;padding-left:10px;border-left:4px solid var(--svc-primary);}
  .svc-card-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;}
  .svc-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;transition:box-shadow .15s,transform .15s;position:relative;overflow:hidden;}
  .svc-card:hover{box-shadow:0 4px 16px rgba(108,92,231,.12);transform:translateY(-2px);}
  .svc-card.has-price{border-left:3px solid var(--svc-gold);}
  .svc-card.no-price{border-left:3px solid var(--svc-primary);}
  .svc-tags{display:flex;gap:6px;margin-bottom:8px;}
  .tag{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500;}
  .tag-online{background:#eef4ff;color:var(--daily);} .tag-offline{background:#fef6e9;color:var(--proj);} .tag-system{background:#f0e6ff;color:var(--svc-primary);}
  .svc-item-name{font-size:14px;font-weight:600;color:var(--head);margin-bottom:4px;}
  .svc-content{font-size:12px;color:var(--text);line-height:1.5;margin-bottom:6px;max-height:60px;overflow:hidden;}
  .svc-remark{font-size:11px;color:var(--muted);line-height:1.4;background:#fafafa;padding:6px 8px;border-radius:6px;margin-bottom:8px;max-height:48px;overflow:hidden;}
  .svc-price-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);}
  .svc-price{font-size:18px;font-weight:700;color:#d35400;}
  .svc-pricing-tag{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;border:1px solid;white-space:nowrap;} /* 颜色由 JS 动态设置 */
  .svc-spec{font-size:11px;color:var(--muted);background:#f0f3f8;padding:2px 8px;border-radius:6px;}
  .svc-unit{font-size:11px;color:var(--muted);}
  .svc-market{font-size:11px;color:#999;text-decoration:line-through;}
  .svc-price-na{font-size:13px;color:var(--svc-primary);font-weight:600;}

  /* ═══ v5.2 计费模式增强样式 ═══ */
  .pricing-legend-box{background:linear-gradient(135deg,#fef9e7,#fff5e6);border:1px solid #f8e5c1;border-radius:12px;padding:14px 18px;margin-bottom:16px;}
  .legend-title{font-size:13px;font-weight:700;color:#b7791f;margin-bottom:8px;}
  .legend-body{display:flex;flex-direction:column;gap:8px;}
  .legend-example{display:flex;align-items:flex-start;gap:8px;background:#fff;padding:10px 14px;border-radius:8px;border-left:3px solid #f39c12;}
  .legend-icon{font-size:18px;flex-shrink:0;margin-top:1px;}
  .legend-text{font-size:12px;color:#555;line-height:1.6;}
  .legend-modes{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
  .lm-tag{font-size:11px;padding:3px 10px;border-radius:12px;font-weight:600;border:1px solid;white-space:nowrap;}
  /* 价格+规格一体化显示 */
  .svc-price-main{display:inline-flex;align-items:baseline;gap:4px;}
  .price-amount{font-size:17px;font-weight:700;color:#d35400;}
  .price-spec{font-size:11px;font-weight:600;color:#e67e22;background:#fdf2e9;padding:1px 6px;border-radius:4px;border:1px solid #fad7a0;}
  .price-na{font-size:13px;color:var(--muted);font-style:italic;}

  @media(max-width:1100px){
    .chart-grid{grid-template-columns:1fr;} .kpi-group{grid-template-columns:repeat(2,1fr);} aside{width:160px;}
    .svc-card-list{grid-template-columns:1fr;}
  }

  /* ═══════════════ 第5页：炫彩介绍页 Landing Page ═══════════════ */
  .land-hero{position:relative;border-radius:16px;overflow:hidden;margin-bottom:28px;min-height:380px;display:flex;align-items:center;justify-content:center;}
  .land-hero-bg{position:absolute;inset:0;background:linear-gradient(135deg,#667eea 0%,#764ba2 25%,#f093fb 50%,#f5576c 75%,#ffd89b 100%);background-size:300% 300%;animation:landGradient 8s ease infinite;}
  @keyframes landGradient{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
  .land-hero-content{position:relative;z-index:2;text-align:center;color:#fff;padding:40px 30px;max-width:720px;}
  .land-badge{display:inline-block;background:rgba(255,255,255,.2);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:6px 18px;font-size:12px;font-weight:600;margin-bottom:18px;letter-spacing:1px;}
  .land-title{font-size:42px;font-weight:800;line-height:1.2;margin:0 0 14px;text-shadow:0 2px 20px rgba(0,0,0,.2);}
  .land-highlight{background:linear-gradient(90deg,#ffd700,#ff6b6b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .land-subtitle{font-size:17px;opacity:.9;margin:0 0 26px;letter-spacing:1px;}
  .land-cta-row{display:flex;gap:12px;justify-content:center;margin-bottom:32px;flex-wrap:wrap;}
  .land-btn{padding:12px 26px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:.25s;}
  .land-btn-primary{background:#fff;color:#764ba2;box-shadow:0 4px 20px rgba(0,0,0,.15);}
  .land-btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.2);}
  .land-btn-secondary{background:rgba(255,255,255,.2);color:#fff;border:1.5px solid rgba(255,255,255,.5);backdrop-filter:blur(4px);}
  .land-btn-secondary:hover{background:rgba(255,255,255,.33);}
  .land-stats-row{display:flex;gap:24px;justify-content:center;flex-wrap:wrap;}
  .land-stat{text-align:center;color:#fff;} .land-stat b{display:block;font-size:28px;font-weight:800;text-shadow:0 1px 10px rgba(0,0,0,.2);} .land-stat span{font-size:11px;opacity:.8;}

  .land-section{margin-bottom:36px;}
  .land-section-title{font-size:20px;font-weight:700;color:var(--head);margin-bottom:18px;text-align:center;}
  .land-value-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  .land-value-card{background:var(--panel);border-radius:14px;padding:22px 18px;border:1px solid var(--line);transition:.25s;}
  .land-value-card:hover{transform:translateY(-4px);box-shadow:0 8px 30px rgba(0,0,0,.08);}
  .lvc-icon{font-size:32px;margin-bottom:10px;}
  .lvc-title{font-size:17px;font-weight:700;margin:0 0 8px;color:var(--head);}
  .lvc-desc{font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 12px;}
  .lvc-points{list-style:none;padding:0;margin:0;}
  .lvc-points li{font-size:11.5px;color:var(--text);padding:4px 0 4px 18px;position:relative;line-height:1.5;}
  .lvc-points li::before{content:'✓';position:absolute;left:0;color:#27ae60;font-weight:700;}

  /* 服务版图 */
  .land-svc-map{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
  .land-svc-bubble{background:var(--panel);border:2px solid #ddd;border-radius:16px;padding:18px 16px;width:180px;text-align:center;transition:.25s;cursor:default;}
  .land-svc-bubble:hover{transform:scale(1.05);box-shadow:0 6px 24px rgba(0,0,0,.1);}
  .land-svc-clickable{cursor:pointer;border-style:solid;}
  .land-svc-clickable:hover{border-width:3px;}
  .lsb-icon{font-size:28px;margin-bottom:6px;}
  .lsb-name{font-size:14px;font-weight:700;color:var(--head);}
  .lsb-count{font-size:11px;color:var(--muted);margin:4px 0;} .lsb-count b{color:var(--head);}
  .lsb-desc{font-size:10px;color:var(--muted);line-height:1.4;}

  /* 团队展示 - 卡通头像 */
  .land-team-grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:720px;margin:0 auto;}
  .land-avatar{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff;cursor:pointer;transition:.2s;background:linear-gradient(135deg,#667eea,#764ba2);border:2px solid transparent;position:relative;}
  .land-avatar:hover{transform:scale(1.2);border-color:#ffd700;box-shadow:0 4px 16px rgba(102,126,234,.4);}
  .land-avatar-cartoon{width:64px;height:68px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.2s;border:2px solid transparent;font-size:22px;box-shadow:0 2px 8px rgba(0,0,0,.1);padding:4px 2px;}
  .land-avatar-cartoon:hover{transform:scale(1.15) translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.18);}
  .land-avatar-emoji{filter:grayscale(0);line-height:1;}
  .land-avatar-en{font-size:9px;color:#fff;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.5);margin-top:2px;white-space:nowrap;}

  /* CTA 底部 */
  .land-cta{background:linear-gradient(135deg,#f093fb 0%,#f5576c 100%);border-radius:16px;padding:40px 30px;text-align:center;color:#fff;margin-top:20px;}
  .land-cta h3{font-size:22px;margin:0 0 10px;}
  .land-cta p{font-size:13px;opacity:.9;margin:0 0 22px;}
  .land-cta .land-btn-primary{background:#fff;color:#f5576c;}

  /* 接单HR区 */
  .hr-pick-section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px;}
  .hr-pick-label{font-size:14px;font-weight:600;color:var(--head);margin-bottom:10px;}
  .hr-pick-grid{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .hr-pick-btn{padding:5px 12px;border:1.5px solid var(--line);border-radius:16px;background:#fff;font-size:11.5px;cursor:pointer;transition:.15s;color:var(--text);}
  .hr-pick-btn:hover{border-color:var(--svc-primary);color:var(--svc-primary);}
  .hr-pick-btn.active{background:var(--svc-primary);color:#fff;border-color:var(--svc-primary);}

  /* 年月筛选 */
  .ym-row{display:flex;gap:6px;}
  .ym-row select{min-width:100px;}

  /* 服务选择计费区 */
  .svc-calc-section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;}
  .svc-calc-title{font-size:15px;font-weight:700;color:var(--head);margin-bottom:14px;display:flex;align-items:center;gap:6px;}
  .svc-calc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-bottom:14px;max-height:340px;overflow-y:auto;padding-right:6px;}
  .svc-calc-group{background:#fafbfc;border:1px solid #eee;border-radius:8px;padding:10px;}
  .svc-calc-group-name{font-size:13px;font-weight:600;color:var(--svc-primary);margin-bottom:8px;padding-bottom:4px;border-bottom:1px dashed var(--line);}
  .svc-calc-item{display:flex;align-items:center;gap:6px;padding:5px 0;font-size:11.5px;cursor:pointer;border-radius:4px;transition:.1s;flex-wrap:wrap;}
  .svc-calc-item:hover{background:#f0eefc;}
  .svc-calc-item input[type=checkbox]{cursor:pointer;accent-color:var(--svc-primary);}
  .svc-calc-item-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px;font-weight:500;}
  /* ★ 数量输入框 */
  .svc-calc-qty-wrap{display:flex;align-items:center;gap:2px;font-size:11px;color:var(--muted);white-space:nowrap;}
  .svc-calc-qty{width:48px;padding:2px 4px;border:1px solid var(--line);border-radius:4px;font-size:11px;text-align:center;outline:none;}
  .svc-calc-qty:focus{border-color:var(--svc-primary);box-shadow:0 0 0 2px rgba(108,92,231,.15);}
  .svc-calc-price-area{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
  .svc-calc-item-price{font-weight:700;color:#d35400;font-size:13px;}
  .svc-total-bar{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,#f093fb 0%,#f5576c 100%);border-radius:10px;padding:14px 20px;color:#fff;}
  .svc-total-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .svc-total-label{font-size:13px;font-weight:600;}
  .svc-fee-select{background:rgba(255,255,255,.25);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:5px 8px;font-size:12px;cursor:pointer;}
  .svc-custom-wrap.hidden{display:none!important;}
  .svc-custom-wrap{display:inline-flex;align-items:center;}
  .svc-custom-input{width:110px;padding:5px 8px;border:1px solid rgba(255,255,255,.5);border-radius:6px;background:rgba(255,255,255,.9);font-size:12px;color:#333;outline:none;}
  .svc-total-right{text-align:right;}
  .svc-total-val{font-size:26px;font-weight:800;line-height:1.1;}
  .svc-total-sub{font-size:11px;opacity:.85;}
  .svc-pdf-btn{display:block;width:100%;margin-top:12px;padding:12px 20px;border:2px dashed var(--svc-primary);border-radius:10px;background:linear-gradient(135deg,#eef2ff,#faf5ff);color:var(--svc-primary);font-size:14px;font-weight:700;cursor:pointer;transition:.2s;text-align:center;}
  .svc-pdf-btn:hover{background:var(--svc-primary);color:#fff;border-style:solid;}

  /* ═══ v6.1 计费区筛选栏 ═══ */
  .svc-calc-filter-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:8px 14px;background:linear-gradient(135deg,#fafbff,#f5f7fa);border:1px solid var(--line);border-radius:9px;flex-wrap:wrap;}
  .svc-calc-search:focus{border-color:var(--svc-primary);box-shadow:0 0 0 2px rgba(108,92,231,.12);}
  .svc-calc-pricing-sel{min-width:130px;}
  .svc-calc-clear{background:#fff;border:1px solid var(--line);border-radius:6px;color:var(--muted);cursor:pointer;transition:.2s;white-space:nowrap;position:relative;z-index:10;flex-shrink:0;pointer-events:auto;font-weight:500;user-select:none;-webkit-user-select:none;}
  .svc-calc-clear:hover{background:#fef2f2;color:#e53935;border-color:#fca5a5;}

  /* ★ v6.4 当前顾问指示条 */
  .svc-advisor-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;margin:12px 0;background:linear-gradient(135deg,#f0edff,#fff5f0);border:1px solid #c4b5fd;border-radius:10px;font-size:14px;}
  .svc-advisor-bar-icon{font-size:22px;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;background:#fff;border-radius:8px;flex-shrink:0;}
  .svc-advisor-bar-text{color:var(--text);flex:1;}
  .svc-advisor-bar-text b{color:var(--svc-primary);}
  .svc-advisor-bar-clear{font-size:12px;padding:4px 12px;border-radius:6px;cursor:pointer;background:none;border:1px solid var(--line);color:var(--muted);transition:.15s;white-space:nowrap;flex-shrink:0;}
  .svc-advisor-bar-clear:hover{background:#fef2f2;color:#e53935;border-color:#fca5a5;}

  /* ★ v6.6 推荐顾问区 */
  .svc-rec-advisor-section{background:linear-gradient(135deg,#f8faff,#fff9f0);border:1px solid #d4c8fd;border-radius:12px;padding:16px 18px;margin:12px 0;}
  .svc-rec-title{font-size:14px;font-weight:700;color:var(--head);margin-bottom:12px;display:flex;align-items:center;gap:6px;}
  .svc-rec-grid{display:flex;gap:10px;flex-wrap:wrap;}
  .svc-rec-card{background:var(--panel);border:1px solid var(--line);border-left:4px solid;border-radius:10px;padding:12px 14px;min-width:180px;max-width:220px;cursor:pointer;transition:.2s;flex:1 1 0;}
  .svc-rec-card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(108,92,231,.15);}
  .svc-rec-name{font-size:14px;font-weight:700;color:var(--head);margin-bottom:2px;}
  .svc-rec-role{font-size:11px;color:var(--svc-primary);font-weight:600;margin-bottom:4px;}
  .svc-rec-desc{font-size:11px;color:var(--muted);line-height:1.4;margin-bottom:6px;}
  .svc-rec-cta{font-size:11px;color:var(--daily);font-weight:600;text-align:right;}

  /* ═══════════════ 第6页：顾问介绍页 Advisor Profile ═══════════════ */
  .advisor-selector{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .advisor-sel-label{font-size:13px;font-weight:600;color:var(--head);white-space:nowrap;}
  .advisor-sel-scroll{display:flex;gap:6px;flex-wrap:wrap;flex:1;overflow-x:auto;padding:4px 0;max-width:100%;}
  .advisor-sel-btn{padding:5px 12px;border:1.5px solid var(--line);border-radius:16px;background:#fff;font-size:11px;cursor:pointer;transition:.15s;color:var(--text);white-space:nowrap;flex-shrink:0;}
  .advisor-sel-btn:hover{border-color:var(--svc-primary);color:var(--svc-primary);}
  .advisor-sel-btn.active{background:var(--svc-primary);color:#fff;}

  .advisor-profile-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.06);}
  .ap-header{padding:20px 24px;text-align:center;color:#fff;position:relative;}
  .ap-header::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:20px;background:var(--panel);border-radius:16px 16px 0 0;}
  .ap-name{font-size:20px;font-weight:700;margin:2px 0;text-shadow:0 1px 8px rgba(0,0,0,.2);}
  .ap-role{font-size:13px;opacity:.9;}
  .ap-body{padding:20px 24px;position:relative;z-index:1;margin-top:-10px;}

  .ap-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
  .ap-metric{background:#f8f9fb;border-radius:10px;padding:12px 10px;text-align:center;border:1px solid #eee;}
  .ap-metric-icon{font-size:22px;margin-bottom:4px;}
  .ap-metric-value{font-size:18px;font-weight:700;color:var(--head);}
  .ap-metric-sub{font-size:10px;color:var(--muted);margin-top:2px;}

  .ap-highlights{display:flex;flex-direction:column;gap:12px;margin-bottom:18px;}
  .ap-strength-badge{display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:12px;border:2px solid;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.06);}
  .ap-strength-icon{font-size:32px;flex-shrink:0;}
  .ap-strength-body{flex:1;min-width:0;}
  .ap-strength-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:3px;}
  .ap-strength-name{font-size:18px;font-weight:800;color:var(--head);margin-bottom:4px;}
  .ap-strength-desc{font-size:12px;color:var(--muted);line-height:1.45;}

  .ap-section-title{font-size:14px;font-weight:600;color:var(--head);margin:16px 0 10px;padding-left:9px;border-left:4px solid var(--svc-primary);}

  .ap-top-list{background:#fafbfc;border:1px solid #eee;border-radius:10px;padding:12px;}
  .ap-top-item{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid #f0f0f0;font-size:12px;}
  .ap-top-item:last-child{border-bottom:none;}
  .ap-top-rank{font-size:14px;font-weight:700;color:var(--svc-primary);min-width:24px;}
  .ap-top-detail{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}
  .ap-top-mod{font-size:10px;padding:2px 8px;border-radius:10px;background:#eef4ff;color:var(--daily);flex-shrink:0;}
  .ap-top-hours{font-weight:700;color:var(--head);flex-shrink:0;min-width:50px;text-align:right;}

  .ap-cta{text-align:center;margin:20px 0 10px;}

  /* ★ 计费模式详情面板 */
  .pricing-mode-detail{grid-column:1/-1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:4px;animation:pmdFadeIn .25s ease;}
  @keyframes pmdFadeIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
  .pmd-head{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;font-weight:600;font-size:13px;}
  .pmd-list{display:flex;flex-direction:column;gap:4px;margin-top:6px;max-height:240px;overflow-y:auto;}
  .pmd-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;background:#f9fafb;font-size:12px;border:1px solid #eee;}
  .pmd-item:hover{background:#f0f3f8;}
  .pmd-item-name{flex:1;font-weight:500;color:var(--head);}
  .pmd-item-price{font-weight:700;color:#e74c3c;white-space:nowrap;font-size:11px;}
  .pmd-item-mod{color:var(--muted);font-size:10px;background:#eef4ff;padding:2px 8px;border-radius:10px;white-space:nowrap;}

  @media(max-width:900px){
    .land-value-grid{grid-template-columns:1fr;} .land-title{font-size:30px;} .land-stats-row{gap:16px;}
    .kpi-group{grid-template-columns:repeat(3,1fr);} .ap-metrics{grid-template-columns:repeat(2,1fr);}
  }

  /* ═════════════ v5.4 顾问页多选标签样式 ═════════════ */
  .ap-hl-title{font-size:14px;font-weight:600;color:var(--head);margin:16px 0 10px;display:flex;align-items:center;gap:6px;}
  .ap-hl-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .ap-hl-chip{
    display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:20px;
    border:2px solid #e0e0e0;background:#fafafa;cursor:pointer;user-select:none;
    transition:.2s;font-size:13px;position:relative;
  }
  .ap-hl-chip:hover{background:#f0f0f0;transform:translateY(-1px);}
  .ap-hl-chip.checked{background:linear-gradient(135deg,#f0e6ff,#fff0f0);border-color:#8b5cf6;box-shadow:0 2px 8px rgba(139,92,246,.15);}
  .ap-hl-cb{position:absolute;opacity:0;pointer-events:none;width:0;height:0;}
  .ap-hl-icon{font-size:15px;}
  .ap-hl-label{font-weight:600;white-space:nowrap;}
  .ap-hl-count{font-size:10px;background:rgba(0,0,0,.06);padding:1px 7px;border-radius:10px;color:var(--muted);}
  /* ★ v5.8 优先级样式：专精标签更醒目 */
  .ap-hl-chip-primary{border-width:2.5px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.08);}
  .ap-hl-chip-primary .ap-hl-label{font-size:14px;}
  .ap-hl-chip-primary .ap-hl-count{font-size:11px;font-weight:600;background:rgba(99,102,241,.12);color:#4f46e5;}
  .ap-hl-chip-secondary{border-width:1.8px;}
  .ap-match-area{text-align:center;margin:18px 0 8px;padding:14px;background:linear-gradient(135deg,#f8f5ff,#fff8f0);border-radius:12px;border:1px dashed #c4b5fd;}
  .ap-match-btn{font-size:15px;padding:10px 28px;border-radius:25px;}
  .ap-hl-actions{display:flex;justify-content:center;gap:8px;margin-top:8px;}

  /* ═════════════ v5.4 服务页标签筛选状态栏 ═════════════ */
  .svc-tag-filter-bar{
    display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:10px 14px;
    background:linear-gradient(135deg,#f0eaff,#fff5f0);border-radius:10px;
    margin:10px 0;border:1px solid #e0d0ff;
  }
  .svc-tag-filter-label{font-size:12px;font-weight:600;color:var(--head);white-space:nowrap;}
  .svc-tag-chip{
    display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:12px;
    font-size:11px;font-weight:500;border:1px solid #ccc;
  }
  .svc-tag-rm{cursor:pointer;font-weight:bold;color:#999;margin-left:2px;font-size:14px;line-height:1;}
  .svc-tag-rm:hover{color:#e74c3c;}

  /* ═════════════ v5.4 详情页CTA按钮区 ═════════════ */
  .detail-cta-area{text-align:center;padding:10px 0 16px;border-top:1px dashed var(--line);margin-top:16px;}
  .detail-cta-btn{display:inline-block !important;text-align:center;}

  /* ═════════════ v5.4 介绍页渐进式展开 ═════════════ */
  .land-collapsible{margin:4px 0;}
  .land-collapse-head{
    cursor:pointer;padding:10px 14px;border-radius:10px;
    transition:.2s;display:flex;align-items:center;gap:8px;
    background:linear-gradient(135deg,#fafbff,#f5f7fa);
    border:1px solid var(--line);
  }
  .land-collapse-head:hover{background:linear-gradient(135deg,#f0f2ff,#eeeef5);}
  .land-collapse-icon{font-size:14px;color:var(--primary);transition:.2s;font-weight:bold;width:16px;text-align:center;}
  .land-collapse-body{overflow:hidden;transition:max-height .35s ease, opacity .25s ease;max-height:2000px;opacity:1;}
  .land-collapse-body.collapsed{max-height:0;opacity:0;margin:0;padding:0;overflow:hidden;}
</style>
</head>
<body>
<header>
  <h1>CN 区 HR 服务指标分析 · 工作量仪表板</h1>
  <div class="right">
    <div class="tabs">
      <button class="tab active" data-page="landing">✨ 介绍</button>
      <button class="tab" data-page="services">服务展示</button>
      <button class="tab" data-page="advisor">👤 顾问</button>
      <button class="tab" data-page="overview">总览</button>
      <button class="tab" data-page="daily">日常工时分布</button>
      <button class="tab" data-page="project">专案工时分布</button>
    </div>
    <button id="btn-info">指标说明</button>
  </div>
</header>
<div class="body">
  <aside><div id="person-list"></div></aside>
  <main>
    <div id="filterbar"></div>
    <div id="page-overview" class="page"></div>
    <div id="page-daily" class="page" style="display:none;"></div>
    <div id="page-project" class="page" style="display:none;"></div>
    <div id="page-services" class="page" style="display:none;"></div>
    <div id="page-landing" class="page" style="display:none;"></div>
    <div id="page-advisor" class="page" style="display:none;"></div>
  </main>
</div>
<script src="jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
